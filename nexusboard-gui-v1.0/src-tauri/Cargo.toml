[package]
name = "nexusboard-gui"
version = "1.0.0"
description = "NexusBoard v1.0 — Dual-Surface Human x AI YAML Project Orchestration"
authors = ["NexusBoard"]
edition = "2021"

[lib]
name = "nexusboard_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
